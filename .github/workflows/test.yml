name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vps-watch:ci .
      - name: smoke test
        run: |
          docker run -d --name web -p 127.0.0.1:18080:18080 vps-watch:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/healthz | grep -q vps-watch
          docker exec web python -c "import worker, merchants; print(sorted(merchants.REGISTRY))"
